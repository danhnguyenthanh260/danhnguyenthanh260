<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Sky Background Gradient -->
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020205" />
      <stop offset="45%" stop-color="#090816" />
      <stop offset="80%" stop-color="#140f29" />
      <stop offset="100%" stop-color="#21173f" />
    </linearGradient>

    <!-- Glowing Route Gradient -->
    <linearGradient id="active-trail-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAA800" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EAA800" stop-opacity="0.9" />
    </linearGradient>

    <!-- Cloud Radial Gradient -->
    <radialGradient id="cloud-fill-grad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF8D6" stop-opacity="0.2" />
      <stop offset="40%" stop-color="#EAA800" stop-opacity="0.08" />
      <stop offset="85%" stop-color="#07070b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#07070b" stop-opacity="0.95" />
    </radialGradient>

    <!-- Airplane Gradients -->
    <linearGradient id="fuselageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F9FAFB" />
      <stop offset="80%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <linearGradient id="nearWingGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6" />
      <stop offset="50%" stop-color="#C8CCD0" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <linearGradient id="farWingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#9CA3AF" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="engineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#4B5563" />
    </linearGradient>
    <linearGradient id="cockpitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="radar-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
    </filter>

    <!-- Moon Mask -->
    <mask id="moon-mask">
      <rect width="800" height="450" fill="white" />
      <circle cx="692" cy="52" r="18" fill="black" />
    </mask>
  </defs>

  <style>
    /* CSS Styling and Keyframes */
    
    /* Background rect */
    .bg {
      fill: url(#sky-grad);
      rx: 16px;
    }

    /* Star Twinkle */
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }
    .star {
      fill: #FFF;
      animation: twinkle 4s infinite ease-in-out;
    }
    .star-fast { animation-duration: 2.5s; }
    .star-slow { animation-duration: 6s; }
    .star-gold { fill: #FFEAA8; }

    /* Constellation Lines */
    .constellation-line {
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 0.8;
      stroke-dasharray: 2 2;
    }

    /* Cloud Drift Animation */
    @keyframes cloudDrift {
      0%, 100% { transform: translate(var(--baseX), var(--baseY)) scale(var(--baseScale)); }
      50% { transform: translate(var(--driftX), var(--driftY)) scale(var(--baseScale)); }
    }
    .cloud {
      animation: cloudDrift 18s ease-in-out infinite;
      will-change: transform;
    }
    .cloud-1 {
      --baseX: 50px; --baseY: 260px; --baseScale: 1.1;
      --driftX: 70px; --driftY: 258px;
      animation-duration: 16s;
    }
    .cloud-2 {
      --baseX: 300px; --baseY: 90px; --baseScale: 1.35;
      --driftX: 315px; --driftY: 92px;
      animation-duration: 22s;
    }
    .cloud-3 {
      --baseX: 470px; --baseY: 180px; --baseScale: 1.0;
      --driftX: 450px; --driftY: 178px;
      animation-duration: 18s;
    }
    .cloud-4 {
      --baseX: 640px; --baseY: 80px; --baseScale: 0.95;
      --driftX: 652px; --driftY: 82px;
      animation-duration: 24s;
    }

    /* Route flow and path */
    .flight-path-bg {
      stroke: rgba(255, 255, 255, 0.09);
      stroke-width: 2.2;
      stroke-dasharray: 5 8;
      stroke-linecap: round;
      fill: none;
    }
    
    @keyframes routeFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -50; }
    }
    .flight-path-flow {
      stroke: url(#active-trail-grad);
      stroke-width: 2.5;
      stroke-dasharray: 8 16;
      stroke-linecap: round;
      fill: none;
      animation: routeFlow 3s linear infinite;
    }

    /* Radar Ping Animation */
    @keyframes ping {
      0% { transform: scale(0.6); opacity: 0.8; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .beacon-ping-1 { transform-origin: 80px 320px; animation: ping 2.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .beacon-ping-2 { transform-origin: 230px 250px; animation: ping 2.8s cubic-bezier(0, 0, 0.2, 1) infinite; animation-delay: 0.5s; }
    .beacon-ping-3 { transform-origin: 380px 200px; animation: ping 2.8s cubic-bezier(0, 0, 0.2, 1) infinite; animation-delay: 1s; }
    .beacon-ping-4 { transform-origin: 530px 200px; animation: ping 2.8s cubic-bezier(0, 0, 0.2, 1) infinite; animation-delay: 1.5s; }
    .beacon-ping-5 { transform-origin: 720px 140px; animation: ping 2.8s cubic-bezier(0, 0, 0.2, 1) infinite; animation-delay: 2s; }

    /* Aircraft Motion along offset-path */
    @keyframes flightMotion {
      0% { offset-distance: 0%; opacity: 0; }
      2% { opacity: 1; }
      96% { opacity: 1; }
      98%, 100% { offset-distance: 100%; opacity: 0; }
    }
    .aircraft-motion {
      offset-path: path('M 80 320 C 180 400, 220 120, 380 200 C 500 260, 600 60, 720 140');
      offset-rotate: auto 0deg;
      animation: flightMotion 14s cubic-bezier(0.35, 0.05, 0.3, 0.95) infinite;
      position: absolute;
    }

    /* Float / Shake on Aircraft */
    @keyframes floatShake {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1deg); }
    }
    .aircraft-float {
      animation: floatShake 3s ease-in-out infinite;
    }

    /* Pulse Glow on UI elements */
    @keyframes beaconGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #EAA800); }
    }
    .pulse-glow {
      animation: beaconGlow 2s ease-in-out infinite;
    }
  </style>

  <!-- 1. Background -->
  <rect class="bg" width="800" height="450" />

  <!-- 2. Stars and Constellations -->
  <g opacity="0.8">
    <!-- Starfield Background -->
    <circle class="star star-fast" cx="120" cy="80" r="1" />
    <circle class="star star-slow star-gold" cx="150" cy="140" r="1.2" />
    <circle class="star" cx="220" cy="50" r="0.8" />
    <circle class="star star-slow" cx="290" cy="180" r="1.5" />
    <circle class="star star-fast" cx="340" cy="90" r="1" />
    <circle class="star star-gold" cx="420" cy="60" r="1.2" />
    <circle class="star star-slow" cx="450" cy="130" r="0.8" />
    <circle class="star" cx="510" cy="80" r="1" />
    <circle class="star star-fast star-gold" cx="580" cy="150" r="1.6" />
    <circle class="star star-slow" cx="600" cy="60" r="0.8" />
    <circle class="star" cx="660" cy="120" r="1.2" />
    <circle class="star star-fast" cx="740" cy="70" r="1" />
    <circle class="star star-slow" cx="760" cy="160" r="1" />

    <!-- Constellation Stars -->
    <circle class="star star-gold" cx="180" cy="70" r="2.5" />
    <circle class="star" cx="250" cy="100" r="2" />
    <circle class="star" cx="310" cy="55" r="2" />
    <circle class="star star-gold" cx="390" cy="115" r="2.5" />
    <circle class="star" cx="480" cy="75" r="2" />
    <circle class="star" cx="550" cy="110" r="2" />
    <circle class="star star-gold" cx="620" cy="45" r="2.5" />

    <!-- Constellation Lines -->
    <polyline class="constellation-line" points="180,70 250,100 310,55 390,115 480,75 550,110 620,45" />
  </g>

  <!-- 3. Crescent Moon -->
  <g>
    <circle cx="680" cy="60" r="18" fill="#FFFBE6" mask="url(#moon-mask)" filter="drop-shadow(0 0 12px rgba(254, 251, 232, 0.45))" />
    <circle cx="680" cy="60" r="18" fill="#FFFBE6" mask="url(#moon-mask)" opacity="0.3" filter="drop-shadow(0 0 25px rgba(254, 251, 232, 0.3))" />
  </g>

  <!-- 4. Base Dotted Flight Path -->
  <path class="flight-path-bg" d="M 80 320 C 180 400, 220 120, 380 200 C 500 260, 600 60, 720 140" />
  <!-- Active Vapor Flow Route -->
  <path class="flight-path-flow" d="M 80 320 C 180 400, 220 120, 380 200 C 500 260, 600 60, 720 140" />

  <!-- 5. Beacons (Nodes) and Beacons Pings -->
  <g id="beacons">
    <!-- Beacon 1 -->
    <circle cx="80" cy="320" r="8" fill="none" stroke="#EAA800" stroke-width="0.8" class="beacon-ping-1" />
    <circle cx="80" cy="320" r="3" fill="#FFF" stroke="#EAA800" stroke-width="1.2" class="pulse-glow" />

    <!-- Beacon 2 -->
    <circle cx="230" cy="250" r="8" fill="none" stroke="#EAA800" stroke-width="0.8" class="beacon-ping-2" />
    <circle cx="230" cy="250" r="3" fill="#FFF" stroke="#EAA800" stroke-width="1.2" class="pulse-glow" />

    <!-- Beacon 3 -->
    <circle cx="380" cy="200" r="8" fill="none" stroke="#EAA800" stroke-width="0.8" class="beacon-ping-3" />
    <circle cx="380" cy="200" r="3" fill="#FFF" stroke="#EAA800" stroke-width="1.2" class="pulse-glow" />

    <!-- Beacon 4 -->
    <circle cx="530" cy="200" r="8" fill="none" stroke="#EAA800" stroke-width="0.8" class="beacon-ping-4" />
    <circle cx="530" cy="200" r="3" fill="#FFF" stroke="#EAA800" stroke-width="1.2" class="pulse-glow" />

    <!-- Beacon 5 -->
    <circle cx="720" cy="140" r="8" fill="none" stroke="#EAA800" stroke-width="0.8" class="beacon-ping-5" />
    <circle cx="720" cy="140" r="3" fill="#FFF" stroke="#EAA800" stroke-width="1.2" class="pulse-glow" />
  </g>

  <!-- 6. Clouds (Drifting Parallax) -->
  <g id="clouds" opacity="0.95">
    <!-- Cloud 1 -->
    <g class="cloud cloud-1">
      <path d="M10,28 Q25,12 48,15 Q62,2 85,10 Q100,5 112,18 Q125,14 130,24 Q140,28 135,38 Q128,45 115,42 L15,42 Q5,40 10,28 Z" fill="url(#cloud-fill-grad)" stroke="rgba(234, 168, 0, 0.15)" stroke-width="0.6" />
      <path d="M25,22 Q40,14 60,18 Q72,10 88,18" fill="none" stroke="rgba(234, 168, 0, 0.08)" stroke-width="0.4" />
    </g>

    <!-- Cloud 2 -->
    <g class="cloud cloud-2">
      <path d="M15,30 Q28,10 52,14 Q68,0 88,10 Q105,4 116,20 Q124,14 130,26 Q138,32 132,42 L20,42 Q8,40 15,30 Z" fill="url(#cloud-fill-grad)" stroke="rgba(234, 168, 0, 0.28)" stroke-width="0.8" />
      <path d="M32,24 Q48,15 68,20 Q78,12 94,22" fill="none" stroke="rgba(234, 168, 0, 0.14)" stroke-width="0.5" />
      <path d="M24,30 Q42,22 62,26 Q76,18 86,27" fill="none" stroke="rgba(234, 168, 0, 0.08)" stroke-width="0.4" />
    </g>

    <!-- Cloud 3 -->
    <g class="cloud cloud-3">
      <path d="M12,28 Q28,8 55,10 Q70,-4 92,6 Q108,-1 118,16 Q128,12 134,24 Q142,28 136,38 L18,38 Q6,36 12,28 Z" fill="url(#cloud-fill-grad)" stroke="rgba(234, 168, 0, 0.18)" stroke-width="0.6" />
      <path d="M28,20 Q44,11 64,16 Q76,8 90,20" fill="none" stroke="rgba(234, 168, 0, 0.09)" stroke-width="0.4" />
    </g>

    <!-- Cloud 4 -->
    <g class="cloud cloud-4">
      <path d="M8,26 Q24,14 44,16 Q58,4 78,8 Q92,1 106,12 Q116,8 124,18 Q132,22 128,32 L12,32 Q4,30 8,26 Z" fill="url(#cloud-fill-grad)" stroke="rgba(234, 168, 0, 0.22)" stroke-width="0.75" />
      <path d="M22,18 Q38,10 54,13 Q68,6 82,14" fill="none" stroke="rgba(234, 168, 0, 0.11)" stroke-width="0.5" />
    </g>
  </g>

  <!-- 7. Animated Aircraft Layer -->
  <g class="aircraft-motion">
    <g class="aircraft-float">
      <!-- Scale and center aircraft viewBox 180x80 inside path coordinates -->
      <g transform="scale(0.24) translate(-90, -40)">
        <!-- Airplane model structure (view="right") -->
        <g transform="translate(-4, 3)" filter="drop-shadow(0 2px 6px rgba(234, 168, 0, 0.4))">
          <!-- Far Wing -->
          <path d="M 115 30 L 98 14 L 90 15 L 102 30 Z" fill="url(#farWingGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.3" />
          <!-- Fuselage -->
          <path
            d="M 170 38 C 168 33, 158 30, 145 30 L 35 31 C 26 31, 20 34, 18 38 C 20 42, 26 44, 35 44 L 145 43 C 158 43, 168 41, 170 38 Z"
            fill="url(#fuselageGrad)"
            stroke="rgba(255,255,255,0.55)"
            stroke-width="0.5"
          />
          <!-- Fuselage Details -->
          <path d="M 25 42 C 35 44, 55 44, 85 44 L 145 43 C 155 43, 165 42, 168 40" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="1.2" />
          <line x1="55" y1="33" x2="140" y2="33" stroke="rgba(31,41,55,0.7)" stroke-width="1.2" stroke-dasharray="2 3" stroke-linecap="round" />
          <!-- Gold Stripe -->
          <path d="M 30 38 L 155 37 L 154.5 38.2 L 30.5 39.2 Z" fill="#EAA800" opacity="0.95" />
          <!-- Cockpit -->
          <path d="M 152 32.2 C 157 32.2, 162 33.5, 163 36 C 161 37.5, 154 37, 149 36 Z" fill="url(#cockpitGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="0.3" />
          <!-- Vertical Stabilizer (Tail) -->
          <path d="M 30 31 L 18 12 L 13 14 L 24 31 Z" fill="url(#fuselageGrad)" stroke="rgba(255,255,255,0.35)" stroke-width="0.4" />
          <!-- Far Horizontal Stabilizer -->
          <path d="M 28 44 L 16 52 L 13 51 L 23 43 Z" fill="url(#farWingGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="0.3" />
          <!-- Near Wing -->
          <path d="M 115 44 L 80 70 L 65 68 L 95 44 Z" fill="url(#nearWingGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="0.4" />
          <!-- Engine -->
          <g>
            <path d="M 82 54 L 78 55 L 82 56 Z" fill="#374151" />
            <path d="M 82 53 C 82 50, 99 50, 99 55 C 99 60, 82 60, 82 55 Z" fill="url(#engineGrad)" stroke="rgba(255,255,255,0.3)" stroke-width="0.4" />
            <ellipse cx="98" cy="55" rx="1.2" ry="3.2" fill="#111827" />
            <polygon points="98,55 96.5,54.2 96.5,55.8" fill="#EAA800" />
          </g>
          <!-- Wing Tip Beacon Light -->
          <g>
            <circle cx="80" cy="70" r="2.2" fill="#10B981" />
            <circle cx="80" cy="70" r="5" fill="#10B981" opacity="0.45" class="star-fast" />
          </g>
        </g>
      </g>
    </g>
  </g>

</svg>
